name: rack

x-app: &app
  build: .
  image: rack:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rack}:${POSTGRES_PASSWORD:-rack}@db:5432/${POSTGRES_DB:-rack}
    RACK_DATA_DIR: /data          # uploads live in /data/uploads
    HF_HOME: /data/hf             # CLIP weights (~600 MB) download here once
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - rack_data:/data

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rack}
      POSTGRES_DB: ${POSTGRES_DB:-rack}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rack}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    ports:
      # Only this PC by default. Set RACK_BIND=0.0.0.0 to open it to your LAN (plain http).
      - "${RACK_BIND:-127.0.0.1}:${RACK_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "rack.worker.main"]
    depends_on:
      api:
        condition: service_healthy  # api runs migrations first

  # Public HTTPS access without opening ports: `docker compose --profile tunnel up -d`
  # (create the tunnel in Cloudflare Zero Trust; route your hostname to http://api:8000).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  pg_data:
  rack_data:
